# Bismillah — GoShop beta on Google Cloud App Engine (standard, nodejs20).
# One-click deploy: bash scripts/deploy-appengine.sh
# Serves the Vite SPA + apps/api (Astro Node) in one process via server.mjs.
runtime: nodejs20
service: default
instance_class: F1
entrypoint: node server.mjs
env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  API_PORT: "8081"
automatic_scaling:
  min_instances: 0
  max_instances: 1
  target_cpu_utilization: 0.75
handlers:
  - url: /.*
    script: auto
    secure: always
