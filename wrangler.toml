# BismiLLAH Ar-Rahman Ar-Roheem. Cloudflare Pages configuration for GoShop Beta.
#
# 100% STATIC deployment — CF Workers and Pages Functions are forbidden
# (lightbase/docs/ZERO_WORKERS_AUDIT.md policy). This file intentionally has
# no functions/ directory, no _worker.js, and no nodejs_compat flag: the SPA
# in dist/ is served straight from the Pages CDN and every dynamic need
# (auth, orders, payments, webhooks, CRUD, translate, emails) lives in
# lightbase — see edge-functions/ and DEPLOYMENT.md.
#
# Deploy:  npx wrangler pages deploy dist/ --project-name=goshop-beta
# (CLOUDFLARE_API_TOKEN is provided by the owner at deploy time.)

name = "goshop-beta"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[dev]
port = 3000
local_protocol = "http"
